dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.h2database:h2:2.3.232'

    implementation "io.github.ztoany.versa:webmvc-problem-details-boot-starter:${versaVersion}"
    implementation "io.github.ztoany.versa:localization-boot-starter:${versaVersion}"
    implementation "io.github.ztoany.versa:web-logging-boot-starter:${versaVersion}"
    implementation "io.github.ztoany.versa:jpa-boot-starter:${versaVersion}"
}
