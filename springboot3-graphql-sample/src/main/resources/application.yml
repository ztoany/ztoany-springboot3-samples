server:
  port: 8080
  shutdown: graceful
  tomcat:
    accesslog:
      enabled: true
      directory: /tmp/springlog

spring:
  application:
    name: springboot3-graphql-sample
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: 12345
    driverClassName: org.h2.Driver
  jpa:
    database: h2
    generate-ddl: true
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: create
  graphql:
    graphiql:
      enabled: true