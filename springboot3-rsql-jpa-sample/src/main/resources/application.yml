server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: springboot3-rsql-jpa-sample
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/testdb?currentSchema=rsqljpa
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    database: postgresql
    generate-ddl: true
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: create